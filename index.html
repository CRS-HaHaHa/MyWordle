<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyWordle">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/CRS-HaHaHa/MyWordle/refs/heads/main/MyWordle.png">
    <meta property="og:title" content="MyWordle - Sfida Multilingua">
    <meta property="og:description" content="Gioca a Wordle in 4 lingue con parole da 5, 6 o 7 lettere. Gratuito e senza pubblicità!">
    <meta property="og:image" content="https://raw.githubusercontent.com/CRS-HaHaHa/MyWordle/refs/heads/main/MyWordle.png">
    <meta property="og:url" content="https://crs-hahaha.github.io/MyWordle/">
    <script src="words_data.js"></script>
    <link rel="manifest" href="manifest.json">
    <title>MyWordle</title>
    <style>
        :root {
            --green: #4CAF50;
            --yellow: #FFB703;
            --gray: #9E9E9E;
            --bg1: #667eea;
            --bg2: #764ba2;
            --card: rgba(255,255,255,0.92);
            --text-dark: #1f2937;
            --accent: #ff6b6b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            margin: 0;
            height: 100dvh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            overflow: hidden;
        }

        #home-screen {
            width: 100%;
            max-width: 900px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            height: 100%;
        }

        h1 {
            text-align: center;
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 900;
            margin-top: 30px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ffd11b, #ffe065);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 6px 20px rgba(0,0,0,.25);
        }

        /* Card contenitori */
        .lang-section {
            background: var(--card);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,.25);
            margin-top: 25px;
        }

        #length-title {
            text-align: center;
            margin-top: 2px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        /* --- STILE GENERALE BOTTONI (Numeri, Gioca, Back) --- */
        button {
            flex: 1;
            padding: 14px;
            font-size: 1.1rem;
            background: #e5e7eb;
            color: var(--text-dark);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            /* Solo qui mettiamo la transizione di movimento */
            transition: transform .15s, box-shadow .15s, background .15s;
        }

        /* Effetto movimento SOLO per i bottoni normali */
        button:not(#lang-it):not(#lang-en):hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,.15);
        }

        button.active {
            background: var(--accent);
            color: white;
        }

        /* --- FIX TOTALE BANDIERE --- */
        /* Usiamo gli ID per vincere su qualsiasi altra regola */
        #lang-it, #lang-en, #lang-fr, #lang-es {
            height: 160px;
            width: 320px;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            border: 4px solid white;
            /* BLOCCO TOTALE MOVIMENTO */
            transform: none !important; 
            transition: border-color 0.2s, box-shadow 0.2s !important;
            margin-top: 0 !important;
        }

        /* Stato Hover/Active delle bandiere: SOLO LUCE, NO MOVIMENTO */
        #lang-it:hover, #lang-en:hover, #lang-fr:hover, #lang-es:hover,
        #lang-it:active, #lang-en:active, #lang-fr:active, #lang-es:active {
            transform: none !important; /* Sicurezza doppia */
            box-shadow: 0 0 20px rgba(255,255,255,0.6) !important;
            filter: brightness(1.1);
            border-color: white;
        }

        #lang-it.active, #lang-en.active, #lang-fr.active, #lang-es.active {
            border-color: #ffd93d; /* Bordo dorato quando attivo */
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5) !important;
            filter: brightness(1.0);
        }

        #lang-it { background-image: url("Flags/it.png"); }
        #lang-en { background-image: url("Flags/gb.png"); }
        #lang-fr { background-image: url("Flags/fr.png"); }
        #lang-es { background-image: url("Flags/es.png"); }

        /* --- NUOVI STILI BOTTONI LUNGHEZZA --- */

        /* Serve per distanziare i bottoni affinché i badge non si sovrappongano */
        .length-group {
            gap: 25px; 
            padding-right: 15px; /* Spazio extra a destra per l'ultimo badge */
        }

        .len-btn {
            position: relative; /* Fondamentale per posizionare il badge */
            overflow: visible;  /* Fondamentale per far uscire il badge dal bordo */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80px; /* Più alti per contenere il testo */
            background: #f3f4f6;
            border: 2px solid transparent;
        }

        .len-btn.active {
            background: white;
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.2);
        }

        .num-large {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1;
        }

        .text-label {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* --- IL BADGE "MEZZO DENTRO MEZZO FUORI" --- */
        .stat-badge {
            position: absolute;
            top: 50%;
            right: -12px; /* Esce fuori a destra */
            transform: translateY(-50%); /* Centrato verticalmente */
            
            background: #2d3436;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            white-space: pre; /* Mantiene l'a capo nel testo \n */
            text-align: center;
            border: 2px solid white; /* Bordo bianco per staccare */
            z-index: 10;
            line-height: 1.2;
        }

        /* Colora il badge del bottone attivo diversamente */
        .len-btn.active .stat-badge {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* --- PLAY BUTTON --- */
        #play-btn {
            flex: none;
            margin: 30px auto 0;
            margin-bottom: 18px;
            padding: 18px 50px;
            height: 80px;
            line-height: 20px;
            width: auto;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #FFD93D, #ff6b6b);
            color: white;
            border-radius: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 25px rgba(255,107,107,0.4);
        }

        .github-link {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 0.8rem;
            color: white;
            text-decoration: none;
            opacity: 0.6;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .github-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Nascondilo quando il gioco è attivo per non distrarre */
        #game-screen ~ .github-link {
            display: none;
        }

        /* --- SCHERMATA GIOCO --- */
        #game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            min-height: 100dvh; /* Forza lo schermo a occupare tutta l'altezza */
            max-width: 800px;
            padding-top: 80px;
            box-sizing: border-box;
            align-items: center;
            position: relative; /* Questo crea il "muro" su cui si attacca la bandiera */
            z-index: 1; /* Alza tutto lo schermo di gioco sopra il body */
        }

        #stats-display {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 1.5rem;
            font-weight: 900;
            background: rgba(255,255,255,.85);
            padding: 8px 14px;
            border-radius: 999px;
            box-shadow: 0 6px 15px rgba(0,0,0,.25);
        }

        #back-btn {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 6px 15px rgba(0,0,0,.25);
            padding: 0;
        }

        #hint-btn {
            position: absolute;
            right: 17px;
            top: 70px; /* Sotto le statistiche */
            background: white;
            border: 2px solid #FFD93D;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            cursor: pointer;
            z-index: 10;
        }
        #hint-btn:active {
            transform: translateY(2px);
        }

        /* GRIGLIA */
        .grid {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            margin-top: 0;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .tile {
            width: 52px;
            height: 52px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            text-transform: uppercase;
            border: 2px solid transparent;
        }

        /* --- TASTIERA A "V" (PIRAMIDE) --- */
        #keyboard {
            position: relative;
            z-index: 10; /* Molto più alto della bandiera (che è 2) */
            width: 100%;
            max-width: 900px;
            padding: 5px;
            margin-top: auto; /* Spinge la tastiera verso il basso */
            margin-bottom: 10px;
        }

        .kb-row {
            display: flex;
            justify-content: center; /* Questo crea la forma a V centrando le righe più corte */
            width: 100%;
            gap: 6px; /* Spazio tra i tasti */
            margin-bottom: 8px;
        }

        .key {
            background: white;
            height: 56px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 0 rgba(0,0,0,.15);
            font-size: 1.2rem;
            user-select: none;
            
            /* TRUCCO PER LARGHEZZA UGUALE */
            width: 8.5%; /* Percentuale fissa per tutti i tasti */
            max-width: 50px; /* Limite per non diventare enormi */
            flex: none; /* Disabilita il riempimento automatico */
        }

        .key:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,.15);
        }

        /* Tasti speciali (Enter/Back) un po' più larghi */
        .key-big {
            width: 13%; 
            max-width: 80px;
            font-size: 1rem;
            background: #f0f0f0;
        }

        #end-popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }

        #popup-content {
            background: white;
            padding: 30px 40px;
            border-radius: 25px;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
        }

        /* --- BANDIERA SFONDO TASTIERA --- */
        #keyboard-bg-flag {
            position: absolute;
            bottom: 0; /* Attaccata al fondo */
            left: 50%;
            transform: translateX(-50%);
            width: 100vw; /* Larga tutto lo schermo di base */
            height: 250px; /* Altezza di base, la regoleremo */
            z-index: 2; /* Dietro la tastiera */
            background-size: cover;
            background-position: center;
            opacity: 0.8; /* Molto soffusa per non disturbare la vista dei tasti */
            filter: blur(5px); /* Leggermente sfocata per un effetto elegante */
            pointer-events: none; /* Non deve bloccare i click sui tasti */
            transition: background-image 0.5s ease;
        }

        /* Colori sfumati per l'anteprima durante la digitazione */
        .tile.preview-green {
            background: 
                linear-gradient(rgba(76, 175, 80, 0.4), rgba(76, 175, 80, 0.4)), 
                linear-gradient(#ffffff, #ffffff) !important;
            border: 2px solid var(--green) !important;
            color: var(--text-dark);
        }

        /* Anteprima: Velo grigio uniforme su base bianca */
        .tile.preview-gray {
            background: 
                linear-gradient(rgba(158, 158, 158, 0.4), rgba(158, 158, 158, 0.4)), 
                linear-gradient(#ffffff, #ffffff) !important;
            border: 2px solid var(--gray) !important;
            color: var(--text-dark);
        }

        /* Regolazione per Computer (schermi larghi) */
        @media (min-width: 900px) {
            #keyboard-bg-flag {
                width: 650px; /* Poco più larga della tastiera (che è 700px) */
                height: 220px; /* Poco più alta della tastiera */
                border-radius: 40px 40px 0 0; /* Arrotondata solo sopra */
                bottom: 10px; /* Sollevata leggermente dal fondo */
            }
        }

        /* --- MOBILE --- */
        @media (max-width: 600px) {
            #home-screen {
                justify-content: flex-start; /* Cambiato da center a flex-start */
                padding-top: 35px;              /* Azzera il padding superiore */
            }
            h1 {
                margin-top: 30px;
                margin-bottom: 30px;
            }

            @media (max-height: 760px) {
                #home-screen {
                    padding-top: 10px;
                }
                h1 {
                    margin-top: 20px;
                    margin-bottom: 20px;
                }
            }

            @media (max-height: 710px) {
                #home-screen {
                    padding-top: 5px; /* Ancora meno padding se lo schermo è corto */
                }
                h1 {
                    font-size: 2rem;   /* Rimpiccioliamo il font */
                    margin-top: 15px;
                    margin-bottom: 15px;
                }
                .language-selector {
                    margin-bottom: 10px;
                }
            }

            /* 1. MODIFICA CONTENITORE: Permette ai bottoni di andare a capo */
            .btn-group:not(.length-group) {
                flex-wrap: wrap;
            }

            /* 2. MODIFICA BANDIERE: 2 per riga */
            #lang-it, #lang-en, #lang-fr, #lang-es {
                height: 100px;
                /* flex-grow: 1, flex-shrink: 1, flex-basis: 40% */
                /* Il 40% forza il browser a metterne solo 2 per riga (perché 40+40+gap < 100, ma 40+40+40 sforerebbe) */
                flex: 1 1 40%; 
            }
            /* 1. Riduzione spazio sopra "Scegli la lunghezza" */
            .lang-section {
                margin-top: 15px; /* Ridotto da 20px */
                padding: 10px;    /* Leggermente più compatto */
            }

            #length-title {
                margin-bottom: 15px;
            }

            /* 2. Pulsanti lunghezza uno sotto l'altro */
            .length-group {
                flex-direction: column; /* Stack verticale */
                gap: 7px;              /* Spazio tra i pulsanti */
                padding-right: 0;       /* Reset padding extra */
            }

            .len-btn {
                flex: none;
                height: 60px; /* Altezza ridotta per mobile */
                width: 100%;  /* Prendono tutta la larghezza disponibile */
            }

            .btn-group {
                gap: 8px;
                margin-top: 8px;
            }

            /* Sistemazione badge per la versione verticale */
            .stat-badge {
                right: 10px; /* Portiamo il badge un po' più dentro per non farlo uscire dallo schermo */
            }

            /* 3. Riduzione pulsante GIOCA */
            #play-btn {
                flex: none;
                margin-top: auto;    /* Ridotto da 40px */
                margin-bottom: 15px;
                height: 60px;
                line-height: 30px;
                padding: 12px 40px;  /* Più basso e meno largo */
                font-size: 1.3rem;   /* Testo leggermente più piccolo */
            }

            #back-btn {
                top: 14px;
            }

            #hint-btn {
                position: absolute;
                left: 75px;
                right: auto;
                top: 16px; /* Sotto le statistiche */
            }

            /* Altri aggiustamenti griglia/tastiera (già presenti nel tuo codice) */
            .tile { width: 44px; height: 44px; font-size: 1.6rem; }
            #keyboard { width: 98%; padding: 2px; margin-bottom: 10px;}
            .kb-row { gap: 3px; margin-bottom: 15px; }
            .key { 
                height: 52px; 
                font-size: 1rem; 
                width: 8.8%; 
                max-width: none;
            }
            .key-big { width: 14%; font-size: 0.8rem; }
            #keyboard-bg-flag {
                width: 100%;
                height: 240px;
                bottom: 0;
                border-radius: 0;
                filter: blur(3px);
            }
            #game-screen {
                justify-content: space-between; /* Aiuta a distribuire gli elementi tra top e tastiera */
            }

            /* Regola per rimpicciolire i quadratini se la parola è lunga */
            .grid-7-letters .tile {
                width: 38px;  /* Più piccoli dei 44px standard */
                height: 38px;
                font-size: 1.4rem;
            }
            
            .grid-7-letters .row {
                gap: 4px; /* Stringiamo anche lo spazio tra le lettere */
            }
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <h1>MyWordle</h1>

        <!-- Toggle lingua -->
        <div class="btn-group">
            <button id="lang-it" class="lang-btn active" onclick="setLanguage('it')"></button>
            <button id="lang-en" class="lang-btn" onclick="setLanguage('en')"></button>
            <button id="lang-fr" class="lang-btn" onclick="setLanguage('fr')"></button>
            <button id="lang-es" class="lang-btn" onclick="setLanguage('es')"></button>
        </div>

        <!-- Lunghezza parole -->
        <div class="lang-section">
            <h2 id="length-title">Scegli la difficoltà</h2>
            <div class="btn-group length-group">
                <button class="len-btn active" onclick="setLength(5)">
                    <span class="num-large">5</span> 
                    <span class="text-label">Lettere</span>
                    <div class="stat-badge" id="badge-5">🔥0 🏆0</div>
                </button>

                <button class="len-btn" onclick="setLength(6)">
                    <span class="num-large">6</span> 
                    <span class="text-label">Lettere</span>
                    <div class="stat-badge" id="badge-6">🔥0 🏆0</div>
                </button>

                <button class="len-btn" onclick="setLength(7)">
                    <span class="num-large">7</span> 
                    <span class="text-label">Lettere</span>
                    <div class="stat-badge" id="badge-7">🔥0 🏆0</div>
                </button>
            </div>
        </div>

        <button id="play-btn" onclick="startGame()">GIOCA</button>
        <a href="https://github.com/crs-hahaha/MyWordle" target="_blank" class="github-link">
        GitHub
    </a>
    </div>

    <div id="game-screen">
        <button id="back-btn" onclick="goHome()">&#x1F3E0</button>
        
        <button id="hint-btn" onclick="useHint()">💡 <span id="hint-count">0</span></button>
        
        <div id="stats-display">🔥 0  🏆 0</div>

        <div class="grid" id="grid"></div>

        <div id="keyboard-bg-flag"></div>

        <div id="keyboard"></div>
    </div>

    <script>
        // Configurazione Globale
        let currentLang = 'it';
        let currentLen = 5;
        let targetWord = "";
        let dictionary = [];
        let currentRow = 0;
        let currentCol = 0;
        let guesses = [];
        let knownLetters = [];  // Memorizza le lettere corrette nelle posizioni esatte
        let wrongPositions = {}; // Memorizza le lettere presenti nella parola ma nella posizione sbagliata
        let absentLetters = new Set(); // Memorizza le lettere che NON esistono nella parola

        function setLanguage(lang) {
            currentLang = lang;

            // Toggle classi attive bandiere
            document.getElementById('lang-it').classList.toggle('active', lang === 'it');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
            document.getElementById('lang-es').classList.toggle('active', lang === 'es');
            
            const bgFlag = document.getElementById('keyboard-bg-flag');
            if (lang === 'it') {
                bgFlag.style.backgroundImage = 'url("Flags/it.png")';
                difficulty = 'Scegli la difficoltà';
                labelText = 'Lettere';
                playButton = 'Gioca';
            } else if (lang === 'en') {
                bgFlag.style.backgroundImage = 'url("Flags/gb.png")';
                difficulty = 'Choose the difficulty';
                labelText = 'Letters';
                playButton = 'Play';
            } else if (lang === 'fr') {
                bgFlag.style.backgroundImage = 'url("Flags/fr.png")';
                difficulty = 'Choisis la difficulté';
                labelText = 'Lettres';
                playButton = 'Jouer';
            } else if (lang === 'es') {
                bgFlag.style.backgroundImage = 'url("Flags/es.png")';
                difficulty = 'Elige la dificultad';
                labelText = 'Letras';
                playButton = 'Jugar';
            }

            // Aggiorna titolo
            document.getElementById('length-title').innerText = difficulty;

            // Aggiorna testo pulsanti (Lettere vs Letters)
            document.querySelectorAll('.text-label').forEach(el => el.innerText = labelText);

            // Aggiorna testo pulsante GIOCA
            document.getElementById('play-btn').innerText = playButton;

            // Ricalcola le statistiche (i badge)
            updateHomeStats();
        }

        function setLength(len) {
            currentLen = len;
            
            // Gestione classe active sui bottoni lunghezza
            document.querySelectorAll('.len-btn').forEach(b => b.classList.remove('active'));
            // Trova il bottone cliccato e attivalo. 
            // Nota: event.currentTarget è più sicuro di event.target quando ci sono elementi figli
            event.currentTarget.classList.add('active');

            updateHomeStats();
        }

        function updateHomeStats() {
            // Aggiorniamo i badge di TUTTI i pulsanti (5, 6, 7)
            [5, 6, 7].forEach(len => {
                const streakKey = `streak_${currentLang}_${len}`;
                const bestKey = `best_${currentLang}_${len}`;
                
                const streak = localStorage.getItem(streakKey) || 0;
                const best = localStorage.getItem(bestKey) || 0;
                
                // Inseriamo i dati nel badge specifico
                const badge = document.getElementById(`badge-${len}`);
                if(badge) {
                    // \n crea l'a capo visivo grazie a white-space: pre nel CSS
                    badge.innerText = `🔥 ${streak}\n🏆 ${best}`;
                }
            });

            // Aggiorniamo anche il display in alto nella schermata di gioco (quello attuale)
            const currentStreak = localStorage.getItem(`streak_${currentLang}_${currentLen}`) || 0;
            const currentBest = localStorage.getItem(`best_${currentLang}_${currentLen}`) || 0;
            document.getElementById('stats-display').innerText = `🔥 ${currentStreak}  🏆 ${currentBest}`;
        }

        function updateHintUI() {
            let hints = parseInt(localStorage.getItem('mywordle_hints')) || 0;
            const hintCountEl = document.getElementById('hint-count');
            if (hintCountEl) {
                hintCountEl.innerText = hints;
            }
        }

        function selectConfig(lang, len, btn) {
            currentLang = lang;
            currentLen = len;
            // Rimuove classe active da tutti e la aggiunge al premuto
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function startGame() {
            // RESET DELLO STATO: Fondamentale per far ricominciare il puntatore da zero
            currentRow = 0;
            currentCol = 0;
            knownLetters = Array(currentLen).fill(null); // Reset conoscenza posizioni
            wrongPositions = {}; // Reset conoscenza posizioni
            absentLetters = new Set(); // Reset lettere inesistenti

            // Recuperiamo le liste direttamente dall'oggetto in memoria
            const solKey = `${currentLang}_${currentLen}_sol`;
            const dictKey = `${currentLang}_${currentLen}_dict`;
            
            // Controlliamo se i dati esistono
            if (!WORD_DATA[solKey] || !WORD_DATA[dictKey]) {
                alert(TEXT[currentLang].dataError); // Usa la traduzione dinamica
                return;
            }

            const solutions = WORD_DATA[solKey];
            dictionary = WORD_DATA[dictKey];
            
            // Scegliamo la parola target
            targetWord = solutions[Math.floor(Math.random() * solutions.length)].toLowerCase();
            // console.log("Parola target:", targetWord); // Per debug, rimuovi in produzione
            
            // Reset interfaccia e avvio
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            initGrid();
            initKeyboard();
            
            // Carica streak
            updateHomeStats();
        }

        function initGrid() {
            const grid = document.getElementById('grid');
            const isMobile = window.innerWidth <= 600;
            
            // Rimuoviamo eventuali classi di layout precedenti
            grid.classList.remove('grid-7-letters');
            grid.style.marginTop = "0"; // Reset iniziale

            // 1. GESTIONE MARGINI (PC vs MOBILE)
            if (isMobile) {
                // Parametri per Telefono
                if (currentLen === 5) grid.style.marginTop = "20px";
                else if (currentLen === 6) grid.style.marginTop = "10px";
                else if (currentLen === 7) {
                    grid.style.marginTop = "5px";
                    grid.classList.add('grid-7-letters'); // Attiva i quadratini piccoli
                }
            } else {
                // Parametri per PC (quelli che avevi prima)
                if (currentLen <= 5) grid.style.marginTop = "-10px";
                else if (currentLen === 6) grid.style.marginTop = "-55px";
                else grid.style.marginTop = "60px";
            }

            // 2. LOGICA DI CREAZIONE GRIGLIA (il resto rimane simile)
            grid.innerHTML = '';
            const maxTries = currentLen + 1;

            // Gestione speciale PC per 7 lettere (due colonne)
            if (!isMobile && currentLen === 7) {
                grid.style.flexDirection = 'row';
                grid.style.gap = '40px';
                const col1 = document.createElement('div');
                const col2 = document.createElement('div');
                [col1, col2].forEach(col => {
                    col.style.display = 'flex';
                    col.style.flexDirection = 'column';
                    col.style.gap = '10px';
                });

                for (let i = 0; i < maxTries; i++) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    for (let j = 0; j < currentLen; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.id = `tile-${i}-${j}`;
                        row.appendChild(tile);
                    }
                    (i < 4 ? col1 : col2).appendChild(row);
                }
                grid.append(col1, col2);
            } else {
                // Layout standard (una colonna) per 5, 6 lettere e per 7 su Mobile
                grid.style.flexDirection = 'column';
                grid.style.gap = isMobile ? '6px' : '8px';

                for (let i = 0; i < maxTries; i++) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    for (let j = 0; j < currentLen; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.id = `tile-${i}-${j}`;
                        row.appendChild(tile);
                    }
                    grid.appendChild(row);
                }
            }
        }

        function initKeyboard() {
            // 1. Definiamo il layout base
            let row1 = "QWERTYUIOP";
            let row2 = "ASDFGHJKL";
            let row3 = "ZXCVBNM";

            // 2. Aggiungiamo il carattere speciale alla seconda riga in base alla lingua
            // Assumo che currentLang sia 'es' per spagnolo e 'fr' per francese
            if (currentLang === 'es') {
                row2 += "Ñ";
            } else if (currentLang === 'fr') {
                row2 += "Ç";
            }

            const layout = [row1, row2, row3];
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';

            layout.forEach((rowStr, i) => {
                const row = document.createElement('div');
                row.className = 'kb-row';
                
                // Terza riga: aggiungi tasto ENTER a sinistra
                if(i === 2) { 
                    const btn = document.createElement('div');
                    btn.className = 'key key-big';
                    btn.innerText = 'ENTER';
                    btn.onclick = submitWord;
                    row.appendChild(btn);
                }

                rowStr.split('').forEach(char => {
                    const btn = document.createElement('div');
                    btn.className = 'key'; 
                    btn.innerText = char;
                    // Usiamo il carattere originale per l'ID (gestisce correttamente ñ e ç)
                    btn.id = `key-${char.toLowerCase()}`;
                    btn.onclick = () => handleInput(char.toLowerCase());
                    row.appendChild(btn);
                });

                // Terza riga: aggiungi tasto DELETE a destra
                if(i === 2) { 
                    const btn = document.createElement('div');
                    btn.className = 'key key-big';
                    btn.innerText = '⌫';
                    btn.onclick = () => handleInput('backspace');
                    row.appendChild(btn);
                }
                kb.appendChild(row);
            });
        }

        function handleInput(key) {
            if (key === 'backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                    tile.innerText = '';
                    tile.classList.remove('preview-green', 'preview-gray'); // Rimuove ogni colore di anteprima quando cancelli
                }
            } else if (/^[a-zñç]$/.test(key)) {
                if (currentCol < currentLen) {
                    const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                    tile.innerText = key.toUpperCase();

                    tile.classList.remove('preview-green', 'preview-gray');

                    // LOGICA DI COLORAZIONE ANTEPRIMA
                    if (knownLetters[currentCol] === key) {
                        tile.classList.add('preview-green');
                    } else if (wrongPositions[key] && wrongPositions[key].includes(currentCol)) {
                    tile.classList.add('preview-gray')
                    } else if (absentLetters.has(key)) {
                        tile.classList.add('preview-gray');
                    }
                    
                    currentCol++;
                }
            }
        }

        function submitWord() {
            let guess = "";
            for(let i=0; i<currentLen; i++) {
                guess += document.getElementById(`tile-${currentRow}-${i}`).innerText.toLowerCase();
            }

            if (guess.length !== currentLen) return;
            if (!dictionary.includes(guess)) {
                showPopup(TEXT[currentLang].notInList);
                for (let i = 0; i < currentLen; i++) {
                    if (currentCol > 0) {
                        currentCol--;
                        const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                        tile.innerText = '';
                        tile.classList.remove('preview-green', 'preview-gray');
                    }
                }
                return;
            }

            checkWord(guess);
        }

        function checkWord(guess) {
            const rowTiles = [];
            for(let i=0; i<currentLen; i++) rowTiles.push(document.getElementById(`tile-${currentRow}-${i}`));
            
            let targetArr = targetWord.split('');
            let statuses = Array(currentLen).fill('gray');

            // Primo pass: Verdi
            for(let i=0; i<currentLen; i++) {
                if(guess[i] === targetArr[i]) {
                    statuses[i] = 'green';
                    targetArr[i] = null;
                }
            }

            // Secondo pass: Gialli
            for(let i=0; i<currentLen; i++) {
                if(statuses[i] !== 'green' && targetArr.includes(guess[i])) {
                    statuses[i] = 'yellow';
                    targetArr[targetArr.indexOf(guess[i])] = null;
                }
            }

            // Aggiorna conoscenza
            statuses.forEach((s, i) => {
                const char = guess[i];
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                
                // Rimuoviamo sempre le classi preview a fine riga
                tile.classList.remove('preview-green', 'preview-gray', 'preview-wrong-pos');

                if (s === 'green') {
                    knownLetters[i] = char;
                    // Se prima pensavamo fosse assente, ora sappiamo che c'è
                    absentLetters.delete(char); 
                } else if (s === 'yellow') {
                    if (!wrongPositions[char]) wrongPositions[char] = [];
                    if (!wrongPositions[char].includes(i)) {
                        wrongPositions[char].push(i);
                    }
                    // Se prima pensavamo fosse assente, ora sappiamo che c'è
                    absentLetters.delete(char);
                } else if (s === 'gray') {
                    // AGGIUNGIAMO AL GRIGIO SOLO SE:
                    // 1. Non l'abbiamo già trovata in una posizione verde
                    // 2. Non l'abbiamo già trovata come gialla
                    const isEverywhereAbsent = !knownLetters.includes(char) && !wrongPositions[char];
                    if (isEverywhereAbsent) {
                        absentLetters.add(char);
                    }
                }
            });

            // Applica colori
            statuses.forEach((s, i) => {
                rowTiles[i].style.backgroundColor = `var(--${s})`;
                rowTiles[i].style.borderColor = `var(--${s})`;
                // Update tastiera
                const key = document.getElementById(`key-${guess[i]}`);
                if (s === 'green') key.style.backgroundColor = 'var(--green)';
                else if (s === 'yellow' && key.style.backgroundColor !== 'var(--green)') key.style.backgroundColor = 'var(--yellow)';
                else if (s === 'gray' && !key.style.backgroundColor) key.style.backgroundColor = 'gray';
            });

            if (guess === targetWord) {
                const gotHint = updateStreak(true); // Salviamo se ha ottenuto l'aiuto
                showEndPopup(true, gotHint);        // Passiamo l'informazione al popup
            } else if (currentRow === currentLen) {
                updateStreak(false);
                showEndPopup(false);
            } else {
                currentRow++;
                currentCol = 0;
            }
        }

        function useHint() {
            document.getElementById('hint-btn').blur();

            let hints = parseInt(localStorage.getItem('mywordle_hints')) || 0;
            
            if (hints <= 0) {
                showPopup(TEXT[currentLang].noHints);
                return;
            }

            let availableIndices = [];
            for (let i = 0; i < currentLen; i++) {
                if (!knownLetters[i]) {
                    availableIndices.push(i);
                }
            }

            if (availableIndices.length === 0) {
                showPopup(TEXT[currentLang].allKnown);
                return;
            }

            let randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            let letter = targetWord[randomIndex];

            // Aggiorniamo la memoria per il "velo"
            knownLetters[randomIndex] = letter;
            absentLetters.delete(letter); 

            // Scaliamo l'aiuto
            hints--;
            localStorage.setItem('mywordle_hints', hints);
            updateHintUI();

            // Prepariamo la frase prendendola dal dizionario e sostituendo i valori
            let msg = TEXT[currentLang].hintRevealed
                        .replace('{N}', randomIndex + 1)
                        .replace('{L}', letter.toUpperCase());
            
            showPopup(msg);
            
            // Coloriamo la tastiera per aiuto visivo
            const key = document.getElementById(`key-${letter}`);
            if (key && key.style.backgroundColor !== 'var(--green)') {
                key.style.backgroundColor = 'var(--yellow)'; 
            }
        }

        const TEXT = {
            it: {
                win: "🎉 HAI VINTO!",
                lose: "😭 LA PAROLA ERA ",
                notInList: "❌ Parola non in elenco",
                dataError: "⚠️ Errore: Dati non trovati nel file words_data.js",
                hintEarned: "\n\n🎁 +1 Aiuto 💡", // Va a capo sotto HAI VINTO
                noHints: "❌ Zero aiuti!\nVinci per ottenerli",
                allKnown: "😎 Sai già tutto!",
                hintRevealed: "💡 Lettera {N}: {L}" // Es: Lettera 3: R
            },
            en: {
                win: "🎉 YOU WON!",
                lose: "😭 THE WORD WAS ",
                notInList: "❌ Word not in list",
                dataError: "⚠️ Error: Data not found in words_data.js",
                hintEarned: "\n\n🎁 +1 Hint 💡",
                noHints: "❌ No hints!\nWin to get them",
                allKnown: "😎 You know everything!",
                hintRevealed: "💡 Letter {N}: {L}"
            },
            fr: {
                win: "🎉 VOUS AVEZ GAGNÉ!",
                lose: "😭 LE MOT ÉTAIT ",
                notInList: "❌ Ce mot n'est pas dans la liste",
                dataError: "⚠️ Erreur : Données non trouvées",
                hintEarned: "\n\n🎁 +1 Indice 💡",
                noHints: "❌ Zéro indice!\nGagnez pour en obtenir",
                allKnown: "😎 Tu sais déjà tout!",
                hintRevealed: "💡 Lettre {N}: {L}"
            },
            es: {
                win: "🎉 ¡HAS GANADO!",
                lose: "😭 LA PALABRA ERA ",
                notInList: "❌ Palabra no en la lista",
                dataError: "⚠️ Error: Datos no encontrados",
                hintEarned: "\n\n🎁 +1 Pista 💡",
                noHints: "❌ ¡Cero pistas!\nGana para obtenerlas",
                allKnown: "😎 ¡Ya lo sabes todo!",
                hintRevealed: "💡 Letra {N}: {L}"
            }
        };

        function showPopup(message) {
            const popup = document.getElementById('end-popup');
            const content = document.getElementById('popup-content');

            content.innerText = message;
            popup.style.display = 'flex';

            setTimeout(() => popup.style.display = 'none', 1800);
        }

        function showEndPopup(win, gotHint = false) {
            let msg = win
                ? TEXT[currentLang].win
                : TEXT[currentLang].lose + targetWord.toUpperCase();

            // Se ha vinto l'aiuto, aggiungiamo la frase sotto "HAI VINTO"
            if (gotHint) {
                msg += TEXT[currentLang].hintEarned;
            }

            showPopup(msg);
            setTimeout(startGame, 2200);
        }

        function updateStreak(win) {
            const streakKey = `streak_${currentLang}_${currentLen}`;
            const bestKey = `best_${currentLang}_${currentLen}`;

            let streak = parseInt(localStorage.getItem(streakKey)) || 0;
            let best = parseInt(localStorage.getItem(bestKey)) || 0;
            let earnedHint = false; // Variabile per tracciare se abbiamo vinto l'aiuto

            if (win) {
                streak++;
                if (streak > best) best = streak;

                // CONTATORE GLOBALE DELLE VITTORIE (vale per sempre e per tutte le lingue)
                let totalWins = parseInt(localStorage.getItem('mywordle_global_wins')) || 0;
                totalWins++;
                localStorage.setItem('mywordle_global_wins', totalWins);

                // Ogni 5 vittorie regaliamo l'aiuto
                if (totalWins % 5 === 0) {
                    let hints = parseInt(localStorage.getItem('mywordle_hints')) || 0;
                    hints++;
                    localStorage.setItem('mywordle_hints', hints);
                    updateHintUI();
                    earnedHint = true; // Segnaliamo che abbiamo vinto!
                }
            } else {
                streak = 0;
            }

            localStorage.setItem(streakKey, streak);
            localStorage.setItem(bestKey, best);
            
            return earnedHint; // Restituiamo il risultato
        }

        function goHome() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            currentRow = 0; currentCol = 0;
            updateHomeStats();
        }

        // Ascolto tastiera fisica
        window.addEventListener('keydown', (e) => {
            if(document.getElementById('game-screen').style.display === 'flex') {
                if(e.key === 'Enter') submitWord();
                else if(e.key === 'Backspace') handleInput('backspace');
                else handleInput(e.key.toLowerCase());
            }
        });

        // Questo codice viene eseguito automaticamente all'apertura della pagina
        window.onload = () => {
            // Inizializza i record basandosi sulla lingua e lunghezza predefinite
            setLanguage(currentLang);
            updateHomeStats();
            updateHintUI();
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {

                // se c'è già un SW in attesa → ricarica quando prende controllo
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
                });

            });
        }

    </script>
    <div id="end-popup" style="display:none">
        <div id="popup-content"></div>
    </div>

</body>
</html>
