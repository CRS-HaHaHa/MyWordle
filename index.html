<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyWordle">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="https://crs-hahaha.github.io/MyWordle/MyWordle.png">
    <meta property="og:title" content="MyWordle - Sfida Multilingua">
    <meta property="og:description" content="Gioca a Wordle in 4 lingue con parole da 5, 6 o 7 lettere. Gratuito e senza pubblicità!">
    <meta property="og:image" content="https://crs-hahaha.github.io/MyWordle/MyWordle_thumbnail.jpg">
    <meta property="og:image:type" content="image/jpg" />
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://crs-hahaha.github.io/MyWordle/?play">
    <script src="words_data.js"></script>
    <link rel="manifest" href="manifest.json">
    <title>MyWordle</title>
    <style>
        :root {
            --green: #4CAF50;
            --yellow: #FFB703;
            --gray: #9E9E9E;
            --bg1: #667eea;
            --bg2: #764ba2;
            --card: rgba(255,255,255,0.92);
            --text-dark: #1f2937;
            --accent: #ff6b6b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            margin: 0;
            height: 100dvh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            overflow: hidden;
        }

        #home-screen {
            width: 100%;
            max-width: 900px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            height: 100%;
        }

        h1 {
            text-align: center;
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 900;
            margin-top: 30px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ffd11b, #ffe065);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 6px 20px rgba(0,0,0,.25);
        }

        #mute-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            height: 10px;
            width: 10px;
            font-size: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Card contenitori */
        .lang-section {
            background: var(--card);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,.25);
            margin-top: 25px;
        }

        #length-title {
            text-align: center;
            margin-top: 2px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        /* --- STILE GENERALE BOTTONI (Numeri, Gioca, Back) --- */
        button {
            flex: 1;
            padding: 14px;
            font-size: 1.1rem;
            background: #e5e7eb;
            color: var(--text-dark);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            /* Solo qui mettiamo la transizione di movimento */
            transition: transform .15s, box-shadow .15s, background .15s;
            
            /* 1. Toglie il rettangolo blu di selezione al tocco su Mobile */
            -webkit-tap-highlight-color: transparent;

            /* 2. Toglie il bordo azzurro di "focus" (quello che rimane dopo il click) */
            outline: none;
        }

        /* Effetto movimento SOLO per i bottoni normali */
        button:not(#lang-it):not(#lang-en):hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,.15);
        }

        button.active {
            background: var(--accent);
            color: white;
        }

        /* --- FIX TOTALE BANDIERE --- */
        /* Usiamo gli ID per vincere su qualsiasi altra regola */
        #lang-it, #lang-en, #lang-fr, #lang-es {
            height: 160px;
            width: 320px;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            border: 4px solid white;
            /* BLOCCO TOTALE MOVIMENTO */
            transform: none !important; 
            transition: border-color 0.2s, box-shadow 0.2s !important;
            margin-top: 0 !important;
        }

        /* Stato Hover/Active delle bandiere: SOLO LUCE, NO MOVIMENTO */
        #lang-it:hover, #lang-en:hover, #lang-fr:hover, #lang-es:hover,
        #lang-it:active, #lang-en:active, #lang-fr:active, #lang-es:active {
            transform: none !important; /* Sicurezza doppia */
            box-shadow: 0 0 20px rgba(255,255,255,0.6) !important;
            filter: brightness(1.1);
            border-color: white;
        }

        #lang-it.active, #lang-en.active, #lang-fr.active, #lang-es.active {
            border-color: #ffd93d; /* Bordo dorato quando attivo */
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5) !important;
            filter: brightness(1.0);
        }

        #lang-it { background-image: url("Flags/it.png"); }
        #lang-en { background-image: url("Flags/gb.png"); }
        #lang-fr { background-image: url("Flags/fr.png"); }
        #lang-es { background-image: url("Flags/es.png"); }

        /* --- NUOVI STILI BOTTONI LUNGHEZZA --- */

        /* Serve per distanziare i bottoni affinché i badge non si sovrappongano */
        .length-group {
            gap: 25px; 
            padding-right: 15px; /* Spazio extra a destra per l'ultimo badge */
        }

        .len-btn {
            position: relative; /* Fondamentale per posizionare il badge */
            overflow: visible;  /* Fondamentale per far uscire il badge dal bordo */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80px; /* Più alti per contenere il testo */
            background: #f3f4f6;
            border: 2px solid;
            border-color: #bdc3c7;
        }

        .len-btn.active {
            background: white;
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.2);
        }

        .num-large {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1;
        }

        .text-label {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* --- IL BADGE "MEZZO DENTRO MEZZO FUORI" --- */
        .stat-badge {
            position: absolute;
            top: 50%;
            right: -12px; /* Esce fuori a destra */
            transform: translateY(-50%); /* Centrato verticalmente */
            
            background: #2d3436;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            white-space: pre; /* Mantiene l'a capo nel testo \n */
            text-align: center;
            border: 2px solid white; /* Bordo bianco per staccare */
            z-index: 10;
            line-height: 1.2;
        }

        /* Colora il badge del bottone attivo diversamente */
        .len-btn.active .stat-badge {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* --- PLAY BUTTON --- */
        #play-btn {
            flex: none;
            margin: 30px auto 0;
            margin-bottom: 18px;
            padding: 18px 50px;
            height: 80px;
            line-height: 20px;
            width: auto;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #FFD93D, #ff6b6b);
            /* 1. Impedisce al gradiente di ripetersi se avanzano pixel ai bordi */
            background-repeat: no-repeat;
            /* 2. Assicura che il gradiente parta dal limite del bordo e non dal padding */
            background-origin: border-box;
            /* 3. Evita che il colore "sbordi" sotto il bordo trasparente in modo strano */
            /* background-clip: padding-box, border-box; */
            color: white;
            border-radius: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 25px rgba(255,107,107,0.4);
        }

        #play-btn:active {
            transform: scale(0.96) translateY(2px);
            box-shadow: 0 4px 10px rgba(255,107,107,0.2);
            filter: brightness(0.9);
        }

        .github-link {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 0.8rem;
            color: white;
            text-decoration: none;
            opacity: 0.6;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .github-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Nascondilo quando il gioco è attivo per non distrarre */
        #game-screen ~ .github-link {
            display: none;
        }

        /* --- SCHERMATA GIOCO --- */
        #game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            min-height: 100dvh; /* Forza lo schermo a occupare tutta l'altezza */
            max-width: 800px;
            padding-top: 80px;
            box-sizing: border-box;
            align-items: center;
            position: relative; /* Questo crea il "muro" su cui si attacca la bandiera */
            z-index: 1; /* Alza tutto lo schermo di gioco sopra il body */
        }

        #stats-display {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 1.5rem;
            font-weight: 900;
            background: rgba(255,255,255,.85);
            padding: 8px 14px;
            border-radius: 999px;
            box-shadow: 0 6px 15px rgba(0,0,0,.25);
        }

        #back-btn {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 6px 15px rgba(0,0,0,.25);
            padding: 0;
        }

        #hint-btn {
            position: absolute;
            right: 17px;
            top: 70px; /* Sotto le statistiche */
            background: white;
            border: 2px solid #FFD93D;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            cursor: pointer;
            z-index: 10;
        }
        #hint-btn:active {
            transform: translateY(2px);
        }

        /* GRIGLIA */
        .grid {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            margin-top: 0;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .tile {
            width: 52px;
            height: 52px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            text-transform: uppercase;
            border: 2px solid #d1d5db;
            transition: border-color 0.2s, transform 0.1s;
        }

        /* Evidenzia il quadratino dove l'utente scriverà la prossima lettera */
        .tile-active {
            border-color: var(--bg2) !important;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        /* --- TASTIERA A "V" (PIRAMIDE) --- */
        #keyboard {
            position: relative;
            z-index: 10; /* Molto più alto della bandiera (che è 2) */
            width: 100%;
            max-width: 900px;
            padding: 5px;
            margin-top: auto; /* Spinge la tastiera verso il basso */
            margin-bottom: 10px;
        }

        .kb-row {
            display: flex;
            justify-content: center; /* Questo crea la forma a V centrando le righe più corte */
            width: 100%;
            gap: 6px; /* Spazio tra i tasti */
            margin-bottom: 8px;
        }

        .key {
            background: white;
            height: 56px;
            border-radius: 12px; /* Leggermente più arrotondati */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 800;
            font-size: 1.2rem;
            user-select: none;
            
            /* Effetto 3D "Keycap" */
            box-shadow: 0 5px 0 #bdc3c7; 
            border: 1px solid rgba(0,0,0,0.05);
            
            /* Transizione fluida per colori e trasformazioni */
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            transition: background-color 0.1s ease, transform 0.05s ease;
            
            width: 8.5%; 
            max-width: 50px;
            flex: none;
            color: var(--text-dark);

            /* 3. Impedisce la selezione del testo se si preme velocemente */
            user-select: none;
        }

        .key:active {
            transform: translateY(4px); /* Si abbassa quasi del tutto */
            box-shadow: 0 1px 0 #bdc3c7; /* La "profondità" sparisce */
            background: #e2e8f0 !important; /* Diventa leggermente più scuro */
            filter: brightness(0.9);
        }
        .key:focus, .key:active {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Tasti speciali (Enter/Back) un po' più larghi */
        .key-big {
            width: 13%; 
            max-width: 80px;
            font-size: 0.9rem;
            background: #d1d5db; /* Colore diverso per distinguerli */
            box-shadow: 0 5px 0 #a0aec0;
        }

        .key-big:active {
            box-shadow: 0 1px 0 #a0aec0;
        }

        #toast-container {
            position: fixed;
            top: 50px; /* Distanza dall'alto */
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Non blocca i click sul gioco */
        }

        .toast {
            background: rgba(33, 37, 41, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 50px; /* Forma a pillola */
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            
            /* Animazione: entra scendendo, sparisce in dissolvenza */
            animation: slideDownIn 0.3s ease-out forwards, 
                    fadeOut 0.3s ease-in 2.2s forwards;
        }

        @keyframes slideDownIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }

        #end-popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }

        #popup-content {
            background: rgba(255, 255, 255, 0.7) !important;
            padding: 30px 40px;
            border-radius: 25px;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            white-space: pre-wrap; /* Rispetta gli "invio" \n presenti nelle stringhe TEXT */
            line-height: 1.4;
        }

        /* --- BANDIERA SFONDO TASTIERA --- */
        #keyboard-bg-flag {
            position: absolute;
            bottom: 0; /* Attaccata al fondo */
            left: 50%;
            transform: translateX(-50%);
            width: 100vw; /* Larga tutto lo schermo di base */
            height: 250px; /* Altezza di base, la regoleremo */
            z-index: 2; /* Dietro la tastiera */
            background-size: cover;
            background-position: center;
            opacity: 0.8; /* Molto soffusa per non disturbare la vista dei tasti */
            filter: blur(5px); /* Leggermente sfocata per un effetto elegante */
            pointer-events: none; /* Non deve bloccare i click sui tasti */
            transition: background-image 0.5s ease;
        }

        /* Colori sfumati per l'anteprima durante la digitazione */
        .tile.preview-green {
            background: 
                linear-gradient(rgba(76, 175, 80, 0.4), rgba(76, 175, 80, 0.4)), 
                linear-gradient(#ffffff, #ffffff) !important;
            border: 2px solid var(--green) !important;
            color: var(--text-dark);
        }

        /* Anteprima: Velo grigio uniforme su base bianca */
        .tile.preview-gray {
            background: 
                linear-gradient(rgba(158, 158, 158, 0.4), rgba(158, 158, 158, 0.4)), 
                linear-gradient(#ffffff, #ffffff) !important;
            border: 2px solid var(--gray) !important;
            color: var(--text-dark);
        }

        /* --- ANIMAZIONI --- */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 1. Pop quando inserisci una lettera */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .tile-pop { animation: pop 0.1s ease-in-out; }

        /* 2. Scuotimento per parola errata (non in elenco) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .row-shake { animation: shake 0.4s ease-in-out; }

        /* 3. Onda di rotazione (Flip) per la verifica */
        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }
        .tile-flip { animation: flip 0.5s ease-in-out forwards; }

        /* 4. Salto della vittoria e effetto dorato */
        @keyframes bounce-gold {
            0%, 100% { transform: translateY(0); }
            50% { 
                transform: translateY(-20px);
                background-color: #FFD700 !important; /* Oro */
                border-color: #B8860B !important;
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            }
        }
        .tile-winner { 
            animation: bounce-gold 0.6s ease-in-out;
            background-color: #FFD700 !important;
            color: #1a1a1a !important;
            border-color: #B8860B !important;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: fixed; width: 10px; height: 10px;
            top: -10px; z-index: 9999;
            animation: confetti-fall 3s linear forwards;
        }

        /* Animazione per l'overlay (lo sfondo scuro/sfocato) */
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Animazione per il contenuto (il rettangolo bianco) */
        @keyframes popupEntrance {
            from { 
                opacity: 0;
                transform: scale(0.8) translateY(20px); 
            }
            to { 
                opacity: 1;
                transform: scale(1) translateY(0); 
            }
        }

        /* Applichiamo lo stile Glassmorphism migliorato */
        .modal-overlay, #end-popup {
            background: rgba(0, 0, 0, 0.4); /* Sfondo scurito */
            backdrop-filter: blur(8px); /* Sfocatura */
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeInOverlay 0.3s ease-out forwards;
        }

        .modal-content, #popup-content {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            
            /* Applichiamo l'animazione di entrata */
            animation: popupEntrance 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Regolazione per Computer (schermi larghi) */
        @media (min-width: 900px) {
            #keyboard-bg-flag {
                width: 650px; /* Poco più larga della tastiera (che è 700px) */
                height: 220px; /* Poco più alta della tastiera */
                border-radius: 40px 40px 0 0; /* Arrotondata solo sopra */
                bottom: 10px; /* Sollevata leggermente dal fondo */
            }
            .key:hover {
                background: #f8f9fa;
                transform: translateY(-2px);
                box-shadow: 0 7px 0 #bdc3c7;
            }
        }

        /* --- MOBILE --- */
        @media (max-width: 600px) {
            #home-screen {
                justify-content: flex-start; /* Cambiato da center a flex-start */
                padding-top: 35px;              /* Azzera il padding superiore */
            }
            h1 {
                margin-top: 30px;
                margin-bottom: 30px;
            }

            @media (max-height: 760px) {
                #home-screen {
                    padding-top: 10px;
                }
                h1 {
                    margin-top: 20px;
                    margin-bottom: 20px;
                }
            }

            @media (max-height: 710px) {
                #home-screen {
                    padding-top: 5px; /* Ancora meno padding se lo schermo è corto */
                }
                h1 {
                    font-size: 2rem;   /* Rimpiccioliamo il font */
                    margin-top: 15px;
                    margin-bottom: 15px;
                }
                .language-selector {
                    margin-bottom: 10px;
                }
            }

            /* 1. MODIFICA CONTENITORE: Permette ai bottoni di andare a capo */
            .btn-group:not(.length-group) {
                flex-wrap: wrap;
            }

            /* 2. MODIFICA BANDIERE: 2 per riga */
            #lang-it, #lang-en, #lang-fr, #lang-es {
                height: 100px;
                /* flex-grow: 1, flex-shrink: 1, flex-basis: 40% */
                /* Il 40% forza il browser a metterne solo 2 per riga (perché 40+40+gap < 100, ma 40+40+40 sforerebbe) */
                flex: 1 1 40%; 
            }
            /* 1. Riduzione spazio sopra "Scegli la lunghezza" */
            .lang-section {
                margin-top: 15px; /* Ridotto da 20px */
                padding: 10px;    /* Leggermente più compatto */
            }

            #length-title {
                margin-bottom: 15px;
            }

            /* 2. Pulsanti lunghezza uno sotto l'altro */
            .length-group {
                flex-direction: column; /* Stack verticale */
                gap: 7px;              /* Spazio tra i pulsanti */
                padding-right: 0;       /* Reset padding extra */
            }

            .len-btn {
                flex: none;
                height: 60px; /* Altezza ridotta per mobile */
                width: 100%;  /* Prendono tutta la larghezza disponibile */
            }

            .btn-group {
                gap: 8px;
                margin-top: 8px;
            }

            /* Sistemazione badge per la versione verticale */
            .stat-badge {
                right: 10px; /* Portiamo il badge un po' più dentro per non farlo uscire dallo schermo */
            }

            /* 3. Riduzione pulsante GIOCA */
            #play-btn {
                flex: none;
                margin-top: auto;    /* Ridotto da 40px */
                margin-bottom: 15px;
                height: 60px;
                line-height: 30px;
                padding: 12px 40px;  /* Più basso e meno largo */
                font-size: 1.3rem;   /* Testo leggermente più piccolo */
            }

            #back-btn {
                top: 14px;
            }

            #hint-btn {
                position: absolute;
                left: 75px;
                right: auto;
                top: 16px; /* Sotto le statistiche */
            }

            /* Altri aggiustamenti griglia/tastiera (già presenti nel tuo codice) */
            .tile { width: 44px; height: 44px; font-size: 1.6rem; }
            #keyboard { width: 98%; padding: 2px; margin-bottom: 10px;}
            .kb-row { gap: 3px; margin-bottom: 15px; }
            .key { 
                height: 52px; 
                font-size: 1rem; 
                width: 8.8%; 
                max-width: none;
            }
            .key-big { width: 14%; font-size: 0.8rem; }
            #keyboard-bg-flag {
                width: 100%;
                height: 240px;
                bottom: 0;
                border-radius: 0;
                filter: blur(3px);
            }
            #game-screen {
                justify-content: space-between; /* Aiuta a distribuire gli elementi tra top e tastiera */
            }

            /* Regola per rimpicciolire i quadratini se la parola è lunga */
            .grid-7-letters .tile {
                width: 38px;  /* Più piccoli dei 44px standard */
                height: 38px;
                font-size: 1.4rem;
            }
            
            .grid-7-letters .row {
                gap: 4px; /* Stringiamo anche lo spazio tra le lettere */
            }
        }
    </style>
</head>
<body>
    <audio id="bg-music" loop>
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>

    <div id="home-screen">
        <!-- <button id="mute-btn" onclick="toggleMute()">🔇</button> -->
        <h1>MyWordle</h1>

        <!-- Toggle lingua -->
        <div class="btn-group">
            <button id="lang-it" class="lang-btn active" onclick="setLanguage('it')"></button>
            <button id="lang-en" class="lang-btn" onclick="setLanguage('en')"></button>
            <button id="lang-fr" class="lang-btn" onclick="setLanguage('fr')"></button>
            <button id="lang-es" class="lang-btn" onclick="setLanguage('es')"></button>
        </div>

        <!-- Lunghezza parole -->
        <div class="lang-section">
            <h2 id="length-title">Scegli la difficoltà</h2>
            <div class="btn-group length-group">
                <button class="len-btn active" onclick="setLength(5)">
                    <span class="num-large">5</span> 
                    <span class="text-label">Lettere</span>
                    <div class="stat-badge" id="badge-5">🔥0 🏆0</div>
                </button>

                <button class="len-btn" onclick="setLength(6)">
                    <span class="num-large">6</span> 
                    <span class="text-label">Lettere</span>
                    <div class="stat-badge" id="badge-6">🔥0 🏆0</div>
                </button>

                <button class="len-btn" onclick="setLength(7)">
                    <span class="num-large">7</span> 
                    <span class="text-label">Lettere</span>
                    <div class="stat-badge" id="badge-7">🔥0 🏆0</div>
                </button>
            </div>
        </div>

        <button id="play-btn" onclick="startGame()">GIOCA</button>
        <a href="https://github.com/crs-hahaha/MyWordle" target="_blank" class="github-link">
            GitHub
        </a>
    </div>

    <div id="game-screen">
        <button id="back-btn" onclick="goHome()">&#x1F3E0</button>
        
        <button id="hint-btn" onclick="useHint()">💡 <span id="hint-count">0</span></button>
        
        <div id="stats-display">🔥 0  🏆 0</div>

        <div class="grid" id="grid"></div>

        <div id="keyboard-bg-flag"></div>

        <div id="keyboard"></div>
    </div>

    <script>
        // Configurazione Globale
        let currentLang = 'it';
        let currentLen = 5;
        let targetWord = "";
        let dictionary = [];
        let currentRow = 0;
        let currentCol = 0;
        let guesses = [];
        let knownLetters = [];  // Memorizza le lettere corrette nelle posizioni esatte
        let wrongPositions = {}; // Memorizza le lettere presenti nella parola ma nella posizione sbagliata
        let absentLetters = new Set(); // Memorizza le lettere che NON esistono nella parola

        // Gestione Volume e Fade-in
        const bgMusic = document.getElementById('bg-music');
        const muteIcon = document.getElementById('mute-btn');

        function playWithFade() {
            if (bgMusic.paused) {
                bgMusic.volume = 0; // Parte da zero
                bgMusic.play().then(() => {
                    let targetVolume = 0.1; // Volume finale desiderato (30% per non essere invadente)
                    let fadeInterval = setInterval(() => {
                        if (bgMusic.volume < targetVolume) {
                            // Incrementa il volume di 0.05 ogni 100ms
                            bgMusic.volume = Math.min(targetVolume, bgMusic.volume + 0.001);
                        } else {
                            clearInterval(fadeInterval);
                        }
                    }, 200);
                }).catch(e => console.log("Audio in attesa di interazione"));
            }
        }

        function toggleMute() {
            bgMusic.yes = !bgMusic.yes;
            muteIcon.innerText = bgMusic.yes ? '🔊' : '🔇';
            if (bgMusic.yes) {
                playWithFade();
            } else {
                bgMusic.pause();
            }
        }

        function setLanguage(lang) {
            currentLang = lang;

            // Toggle classi attive bandiere
            document.getElementById('lang-it').classList.toggle('active', lang === 'it');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
            document.getElementById('lang-es').classList.toggle('active', lang === 'es');
            
            const bgFlag = document.getElementById('keyboard-bg-flag');
            if (lang === 'it') {
                bgFlag.style.backgroundImage = 'url("Flags/it.png")';
                difficulty = 'Scegli la difficoltà';
                labelText = 'Lettere';
                playButton = 'Gioca';
            } else if (lang === 'en') {
                bgFlag.style.backgroundImage = 'url("Flags/gb.png")';
                difficulty = 'Choose the difficulty';
                labelText = 'Letters';
                playButton = 'Play';
            } else if (lang === 'fr') {
                bgFlag.style.backgroundImage = 'url("Flags/fr.png")';
                difficulty = 'Choisis la difficulté';
                labelText = 'Lettres';
                playButton = 'Jouer';
            } else if (lang === 'es') {
                bgFlag.style.backgroundImage = 'url("Flags/es.png")';
                difficulty = 'Elige la dificultad';
                labelText = 'Letras';
                playButton = 'Jugar';
            }

            // Aggiorna titolo
            document.getElementById('length-title').innerText = difficulty;

            // Aggiorna testo pulsanti (Lettere vs Letters)
            document.querySelectorAll('.text-label').forEach(el => el.innerText = labelText);

            // Aggiorna testo pulsante GIOCA
            document.getElementById('play-btn').innerText = playButton;

            // Ricalcola le statistiche (i badge)
            updateHomeStats();
        }

        function setLength(len) {
            currentLen = len;
            
            // Gestione classe active sui bottoni lunghezza
            document.querySelectorAll('.len-btn').forEach(b => b.classList.remove('active'));
            // Trova il bottone cliccato e attivalo. 
            // Nota: event.currentTarget è più sicuro di event.target quando ci sono elementi figli
            event.currentTarget.classList.add('active');

            updateHomeStats();
        }

        function updateHomeStats() {
            // Aggiorniamo i badge di TUTTI i pulsanti (5, 6, 7)
            [5, 6, 7].forEach(len => {
                const streakKey = `streak_${currentLang}_${len}`;
                const bestKey = `best_${currentLang}_${len}`;
                
                const streak = localStorage.getItem(streakKey) || 0;
                const best = localStorage.getItem(bestKey) || 0;
                
                // Inseriamo i dati nel badge specifico
                const badge = document.getElementById(`badge-${len}`);
                if(badge) {
                    // \n crea l'a capo visivo grazie a white-space: pre nel CSS
                    badge.innerText = `🔥 ${streak}\n🏆 ${best}`;
                }
            });

            // Aggiorniamo anche il display in alto nella schermata di gioco (quello attuale)
            const currentStreak = localStorage.getItem(`streak_${currentLang}_${currentLen}`) || 0;
            const currentBest = localStorage.getItem(`best_${currentLang}_${currentLen}`) || 0;
            document.getElementById('stats-display').innerText = `🔥 ${currentStreak}  🏆 ${currentBest}`;
        }

        function updateHintUI() {
            let hints = parseInt(localStorage.getItem('mywordle_hints')) || 0;
            const hintCountEl = document.getElementById('hint-count');
            if (hintCountEl) {
                hintCountEl.innerText = hints;
            }
        }

        function selectConfig(lang, len, btn) {
            currentLang = lang;
            currentLen = len;
            // Rimuove classe active da tutti e la aggiunge al premuto
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function startGame() {
            // Reset interfaccia e avvio
            const gameScreen = document.getElementById('game-screen');
            document.getElementById('home-screen').style.display = 'none';
            gameScreen.style.display = 'flex';
            gameScreen.classList.add('fade-in-up');

            initGrid();
            initKeyboard();

            const sessionKey = `session_${currentLang}_${currentLen}`;
            const saved = localStorage.getItem(sessionKey);

            // Recuperiamo le liste direttamente dall'oggetto in memoria
            const solKey = `${currentLang}_${currentLen}_sol`;
            const dictKey = `${currentLang}_${currentLen}_dict`;
            // Controlliamo se i dati esistono
            if (!WORD_DATA[solKey] || !WORD_DATA[dictKey]) {
                alert(TEXT[currentLang].dataError); // Usa la traduzione dinamica
                return;
            }
            dictionary = WORD_DATA[dictKey];

            if (saved) {
                const state = JSON.parse(saved);
                // Ripristiniamo la logica
                targetWord = state.targetWord;
                currentRow = state.currentRow;
                currentCol = 0;
                knownLetters = state.knownLetters;
                wrongPositions = state.wrongPositions;
                absentLetters = new Set(state.absentLetters);

                // Ricostruiamo la griglia visiva e i colori
                state.guesses.forEach((guess, rIndex) => {
                    recolorRowFromSaved(guess, rIndex);
                });
                updateKeyboardColors(); // Funzione che colora i tasti in base ai risultati
            } else {
                // Nessun salvataggio: Nuova partita
                currentRow = 0;
                currentCol = 0;
                
                const solutions = WORD_DATA[solKey];
                targetWord = solutions[Math.floor(Math.random() * solutions.length)].toLowerCase();
                knownLetters = Array(currentLen).fill(null);
                wrongPositions = {};
                absentLetters = new Set();
                saveGameState(); // Creiamo subito il salvataggio iniziale
            }
            console.log("Parola target:", targetWord); // Per debug, rimuovi in produzione           
            
            // Carica streak
            updateHomeStats();
            updateActiveTile();
        }

        function recolorRowFromSaved(guess, rowIndex) {
            const statuses = getLetterStatuses(guess, targetWord);
            statuses.forEach((s, colIndex) => {
                const tile = document.getElementById(`tile-${rowIndex}-${colIndex}`);
                tile.innerText = guess[colIndex].toUpperCase();
                tile.style.backgroundColor = `var(--${s})`;
                tile.style.borderColor = `var(--${s})`;
                
                // Rimuoviamo eventuali classi di preview rimaste
                tile.classList.remove('preview-green', 'preview-gray', 'preview-wrong-pos');
            });
        }

        function updateKeyboardColors() {
            // 1. Reset iniziale: riportiamo i tasti al colore base (opzionale se già puliti)
            const keys = document.querySelectorAll('.key');
            keys.forEach(k => k.style.backgroundColor = '');

            // 2. Recuperiamo tutte le parole scritte finora nella griglia
            const guesses = getGuessesSoFar();

            guesses.forEach(guess => {
                const statuses = getLetterStatuses(guess, targetWord);
                
                statuses.forEach((s, i) => {
                    const char = guess[i];
                    const key = document.getElementById(`key-${char}`);
                    if (!key) return;

                    const currentColor = key.style.backgroundColor;

                    // Logica di precedenza: Verde > Giallo > Grigio
                    if (s === 'green') {
                        key.style.backgroundColor = 'var(--green)';
                    } else if (s === 'yellow') {
                        // Diventa giallo solo se non è già verde
                        if (currentColor !== 'var(--green)') {
                            key.style.backgroundColor = 'var(--yellow)';
                        }
                    } else if (s === 'gray') {
                        // Diventa grigio solo se non ha già un colore (verde o giallo)
                        if (!currentColor) {
                            key.style.backgroundColor = 'gray';
                        }
                    }
                });
            });
        }

        function getLetterStatuses(guess, target) {
            let n = target.length;
            let statuses = Array(n).fill('gray');
            let targetArr = target.split('');
            let guessArr = guess.split('');

            // 1. Primo passaggio: Trova i VERDI (corrispondenza esatta)
            for (let i = 0; i < n; i++) {
                if (guessArr[i] === targetArr[i]) {
                    statuses[i] = 'green';
                    targetArr[i] = null; // "Consumiamo" la lettera nella soluzione
                    guessArr[i] = null;  // "Consumiamo" la lettera nel tentativo
                }
            }

            // 2. Secondo passaggio: Trova i GIALLI (lettera presente ma posto sbagliato)
            for (let i = 0; i < n; i++) {
                if (guessArr[i] !== null) { // Salta quelle già segnate verdi
                    let indexInTarget = targetArr.indexOf(guessArr[i]);
                    if (indexInTarget !== -1) {
                        statuses[i] = 'yellow';
                        targetArr[indexInTarget] = null; // Consumiamo la lettera
                    }
                }
            }

            return statuses;
        }

        function initGrid() {
            const grid = document.getElementById('grid');
            const isMobile = window.innerWidth <= 600;
            
            // Rimuoviamo eventuali classi di layout precedenti
            grid.classList.remove('grid-7-letters');
            grid.style.marginTop = "0"; // Reset iniziale

            // 1. GESTIONE MARGINI (PC vs MOBILE)
            if (isMobile) {
                // Parametri per Telefono
                if (currentLen === 5) grid.style.marginTop = "20px";
                else if (currentLen === 6) grid.style.marginTop = "10px";
                else if (currentLen === 7) {
                    grid.style.marginTop = "5px";
                    grid.classList.add('grid-7-letters'); // Attiva i quadratini piccoli
                }
            } else {
                // Parametri per PC (quelli che avevi prima)
                if (currentLen <= 5) grid.style.marginTop = "-10px";
                else if (currentLen === 6) grid.style.marginTop = "-55px";
                else grid.style.marginTop = "60px";
            }

            // 2. LOGICA DI CREAZIONE GRIGLIA (il resto rimane simile)
            grid.innerHTML = '';
            const maxTries = currentLen + 1;

            // Gestione speciale PC per 7 lettere (due colonne)
            if (!isMobile && currentLen === 7) {
                grid.style.flexDirection = 'row';
                grid.style.gap = '40px';
                const col1 = document.createElement('div');
                const col2 = document.createElement('div');
                [col1, col2].forEach(col => {
                    col.style.display = 'flex';
                    col.style.flexDirection = 'column';
                    col.style.gap = '10px';
                });

                for (let i = 0; i < maxTries; i++) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    for (let j = 0; j < currentLen; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.id = `tile-${i}-${j}`;
                        row.appendChild(tile);
                    }
                    (i < 4 ? col1 : col2).appendChild(row);
                }
                grid.append(col1, col2);
            } else {
                // Layout standard (una colonna) per 5, 6 lettere e per 7 su Mobile
                grid.style.flexDirection = 'column';
                grid.style.gap = isMobile ? '6px' : '8px';

                for (let i = 0; i < maxTries; i++) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    for (let j = 0; j < currentLen; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.id = `tile-${i}-${j}`;
                        row.appendChild(tile);
                    }
                    grid.appendChild(row);
                }
            }
        }

        function initKeyboard() {
            // 1. Definiamo il layout base
            let row1 = "QWERTYUIOP";
            let row2 = "ASDFGHJKL";
            let row3 = "ZXCVBNM";

            // 2. Aggiungiamo il carattere speciale alla seconda riga in base alla lingua
            // Assumo che currentLang sia 'es' per spagnolo e 'fr' per francese
            if (currentLang === 'es') {
                row2 += "Ñ";
            } else if (currentLang === 'fr') {
                row2 += "Ç";
            }

            const layout = [row1, row2, row3];
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';

            layout.forEach((rowStr, i) => {
                const row = document.createElement('div');
                row.className = 'kb-row';
                
                // Terza riga: aggiungi tasto ENTER a sinistra
                if(i === 2) { 
                    const btn = document.createElement('div');
                    btn.className = 'key key-big';
                    btn.innerText = 'ENTER';
                    btn.onclick = submitWord;
                    row.appendChild(btn);
                }

                rowStr.split('').forEach(char => {
                    const btn = document.createElement('div');
                    btn.className = 'key'; 
                    btn.innerText = char;
                    // Usiamo il carattere originale per l'ID (gestisce correttamente ñ e ç)
                    btn.id = `key-${char.toLowerCase()}`;
                    btn.onclick = () => handleInput(char.toLowerCase());
                    row.appendChild(btn);
                });

                // Terza riga: aggiungi tasto DELETE a destra
                if(i === 2) { 
                    const btn = document.createElement('div');
                    btn.className = 'key key-big';
                    btn.innerText = '⌫';
                    btn.onclick = () => handleInput('backspace');
                    row.appendChild(btn);
                }
                kb.appendChild(row);
            });
        }

        function handleInput(key) {
            if (key === 'backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                    tile.innerText = '';
                    tile.classList.remove('preview-green', 'preview-gray'); // Rimuove ogni colore di anteprima quando cancelli
                }
            } else if (/^[a-zñç]$/.test(key)) {
                if (currentCol < currentLen) {
                    const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                    tile.innerText = key.toUpperCase();

                    // Rimuove e riaggiunge la classe per resettare l'animazione
                    tile.classList.remove('tile-pop');
                    void tile.offsetWidth; // Trucco per resettare l'animazione CSS
                    tile.classList.add('tile-pop');

                    tile.classList.remove('preview-green', 'preview-gray');

                    // LOGICA DI COLORAZIONE ANTEPRIMA
                    if (knownLetters[currentCol] === key) {
                        tile.classList.add('preview-green');
                    } else if (wrongPositions[key] && wrongPositions[key].includes(currentCol)) {
                    tile.classList.add('preview-gray')
                    } else if (absentLetters.has(key)) {
                        tile.classList.add('preview-gray');
                    }
                    
                    currentCol++;
                }
            }
            updateActiveTile();
        }

        function updateActiveTile() {
            // Rimuoviamo la classe 'tile-active' da TUTTE le celle della riga corrente
            for (let i = 0; i < currentLen; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                if (tile) tile.classList.remove('tile-active');
            }

            // Aggiungiamo la classe solo alla cella corrispondente a currentCol
            // (ma solo se non abbiamo già riempito tutta la riga)
            if (currentCol < currentLen) {
                const activeTile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                if (activeTile) activeTile.classList.add('tile-active');
            }
        }

        function submitWord() {
            let guess = "";
            for(let i=0; i<currentLen; i++) {
                guess += document.getElementById(`tile-${currentRow}-${i}`).innerText.toLowerCase();
            }

            if (guess.length !== currentLen) return;

            if (!dictionary.includes(guess)) {
                const currentRowEl = document.querySelectorAll('.row')[currentRow];
                
                // 1. Inizia lo scuotimento
                currentRowEl.classList.add('row-shake');
                showToast(TEXT[currentLang].notInList);
                
                // 2. Aspettiamo che finisca lo scuotimento (400ms) prima di cancellare
                setTimeout(() => {
                    currentRowEl.classList.remove('row-shake');
                    
                    // 3. Cancellazione progressiva (opzionale, o tutto insieme)
                    let i = currentLen - 1;
                    const interval = setInterval(() => {
                        if (i >= 0) {
                            const tile = document.getElementById(`tile-${currentRow}-${i}`);
                            tile.innerText = '';
                            tile.classList.remove('preview-green', 'preview-gray', 'tile-pop');
                            i--;
                        } else {
                            currentCol = 0;
                            clearInterval(interval);
                        }
                    }, 50); // Cancella una lettera ogni 50ms
                    currentCol = 0; // Reset della posizione al primo quadratino
                    
                }, 400);

                return;
            }

            checkWord(guess);
        }

        function checkWord(guess) {
            const rowTiles = [];
            for(let i=0; i<currentLen; i++) rowTiles.push(document.getElementById(`tile-${currentRow}-${i}`));

            // USIAMO LA NUOVA FUNZIONE LOGICA
            const statuses = getLetterStatuses(guess, targetWord);

            // 1. Aggiorna conoscenza (Memoria per il "velo" predittivo)
            statuses.forEach((s, i) => {
                const char = guess[i];
                const tile = rowTiles[i];
                
                // Pulizia classi preview
                tile.classList.remove('preview-green', 'preview-gray', 'preview-wrong-pos');

                if (s === 'green') {
                    knownLetters[i] = char;
                    absentLetters.delete(char); 
                } else if (s === 'yellow') {
                    if (!wrongPositions[char]) wrongPositions[char] = [];
                    if (!wrongPositions[char].includes(i)) wrongPositions[char].push(i);
                    absentLetters.delete(char);
                } else if (s === 'gray') {
                    // Logica "isEverywhereAbsent" originale
                    const isEverywhereAbsent = !knownLetters.includes(char) && !wrongPositions[char];
                    if (isEverywhereAbsent) {
                        absentLetters.add(char);
                    }
                }
            });

            // 2. Applica colori alla UI (Griglia e Tastiera) - Applichiamo l'effetto onda (Flip)
            statuses.forEach((s, i) => {
                setTimeout(() => {
                    rowTiles[i].classList.add('tile-flip');
                    
                    // Cambiamo il colore a metà della rotazione (0.25s)
                    setTimeout(() => {
                        const char = guess[i];
                        const tile = rowTiles[i];
                        tile.style.backgroundColor = `var(--${s})`;
                        tile.style.borderColor = `var(--${s})`;
                        tile.style.color = "black"; // Più leggibile sul colore

                        // Aggiorna tastiera
                        updateSingleKey(char, s);
                    }, 250);
                }, i * 100); // 100ms di ritardo tra ogni lettera
            });

            // 3. Logica di fine riga o fine partita
            setTimeout(() => {
                if (guess === targetWord) {
                    // Animazione vittoria
                    launchConfetti();
                    rowTiles.forEach((tile, i) => {
                        setTimeout(() => tile.classList.add('tile-winner'), i * 100);
                    });
                    
                    const gotHint = updateStreak(true);
                    setTimeout(() => showEndPopup(true, gotHint), 1800);
                    clearGameState(); // Ricordati di pulire la sessione quando si vince!
                } else if (currentRow === currentLen) {
                    updateStreak(false);
                    showEndPopup(false);
                    clearGameState(); // E quando si perde!
                } else {
                    currentRow++;
                    currentCol = 0;
                    saveGameState();
                    updateActiveTile();
                }
            }, currentLen * 100 + 500);
        }

        function launchConfetti() {
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + "vw";
                c.style.backgroundColor = ["#667eea", "#764ba2", "#FFD700", "#48bb78"][Math.floor(Math.random()*4)];
                c.style.animationDelay = Math.random() * 2 + "s";
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 5000);
            }
        }

        function updateSingleKey(char, status) {
            const key = document.getElementById(`key-${char}`);
            if (!key) return;
            if (status === 'green') {
                key.style.backgroundColor = 'var(--green)';
            } else if (status === 'yellow' && key.style.backgroundColor !== 'var(--green)') {
                key.style.backgroundColor = 'var(--yellow)';
            } else if (status === 'gray' && !key.style.backgroundColor) {
                key.style.backgroundColor = 'gray';
            }
        }                

        function useHint() {
            document.getElementById('hint-btn').blur();

            let hints = parseInt(localStorage.getItem('mywordle_hints')) || 0;
            
            if (hints <= 0) {
                // Recuperiamo le vittorie totali
                let totalWins = parseInt(localStorage.getItem('mywordle_global_wins')) || 0;
                
                // Calcoliamo quante mancano al prossimo multiplo di 5
                // Se totalWins è 1, mancano 4 (5 - 1)
                // Se totalWins è 4, manca 1 (5 - 4)
                // Se totalWins è 5, il modulo è 0, quindi mancano 5 per il prossimo
                let missing = 5 - (totalWins % 5);
                
                // Prendiamo il testo e sostituiamo {N} con il numero calcolato
                let msg = TEXT[currentLang].noHints.replace('{N}', missing);
                
                showPopup(msg);
                return;
            }

            let availableIndices = [];
            for (let i = 0; i < currentLen; i++) {
                if (!knownLetters[i]) {
                    availableIndices.push(i);
                }
            }

            if (availableIndices.length === 0) {
                showPopup(TEXT[currentLang].allKnown);
                return;
            }

            let randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            let letter = targetWord[randomIndex];

            // Aggiorniamo la memoria per il "velo"
            knownLetters[randomIndex] = letter;
            absentLetters.delete(letter); 

            // Scaliamo l'aiuto
            hints--;
            localStorage.setItem('mywordle_hints', hints);
            updateHintUI();

            // Prepariamo la frase prendendola dal dizionario e sostituendo i valori
            let msg = TEXT[currentLang].hintRevealed
                        .replace('{N}', randomIndex + 1)
                        .replace('{L}', letter.toUpperCase());
            
            showPopup(msg);
            
            // Coloriamo la tastiera per aiuto visivo
            const key = document.getElementById(`key-${letter}`);
            if (key && key.style.backgroundColor !== 'var(--green)') {
                key.style.backgroundColor = 'var(--yellow)'; 
            }
        }

        const TEXT = {
            it: {
                win: "🎉 HAI VINTO!",
                lose: "😭 LA PAROLA ERA ",
                notInList: "❌ Parola non in elenco",
                dataError: "⚠️ Errore: Dati non trovati nel file words_data.js",
                hintEarned: "\n\n🎁 +1 Aiuto 💡", // Va a capo sotto HAI VINTO
                noHints: "❌ Zero aiuti!\nVinci altre {N} partite per ottenerne uno",
                allKnown: "😎 Sai già tutto!",
                hintRevealed: "💡 Lettera {N}: {L}" // Es: Lettera 3: R
            },
            en: {
                win: "🎉 YOU WON!",
                lose: "😭 THE WORD WAS ",
                notInList: "❌ Word not in list",
                dataError: "⚠️ Error: Data not found in words_data.js",
                hintEarned: "\n\n🎁 +1 Hint 💡",
                noHints: "❌ No hints!\nWin {N} more games to get one",
                allKnown: "😎 You know everything!",
                hintRevealed: "💡 Letter {N}: {L}"
            },
            fr: {
                win: "🎉 VOUS AVEZ GAGNÉ!",
                lose: "😭 LE MOT ÉTAIT ",
                notInList: "❌ Ce mot n'est pas dans la liste",
                dataError: "⚠️ Erreur : Données non trouvées",
                hintEarned: "\n\n🎁 +1 Indice 💡",
                noHints: "❌ Zéro indice!\nGagne encore {N} parties per ne obtenir un",
                allKnown: "😎 Tu sais déjà tout!",
                hintRevealed: "💡 Lettre {N}: {L}"
            },
            es: {
                win: "🎉 ¡HAS GANADO!",
                lose: "😭 LA PALABRA ERA ",
                notInList: "❌ Palabra no en la lista",
                dataError: "⚠️ Error: Datos no encontrados",
                hintEarned: "\n\n🎁 +1 Pista 💡",
                noHints: "❌ ¡Cero pistas!\nGana {N} partidas más para obtener una",
                allKnown: "😎 ¡Ya lo sabes todo!",
                hintRevealed: "💡 Letra {N}: {L}"
            }
        };

        function showPopup(message) {
            const popup = document.getElementById('end-popup');
            const content = document.getElementById('popup-content');

            content.innerText = message;
            popup.style.display = 'flex';

            setTimeout(() => popup.style.display = 'none', 2000);
        }

        function showEndPopup(win, gotHint = false) {
            let msg = win
                ? TEXT[currentLang].win
                : TEXT[currentLang].lose + targetWord.toUpperCase();

            // Se ha vinto l'aiuto, aggiungiamo la frase sotto "HAI VINTO"
            if (gotHint) {
                msg += TEXT[currentLang].hintEarned;
            }

            clearGameState(); // Rimuoviamo il salvataggio a fine partita
            showPopup(msg);
            setTimeout(startGame, 2200);
        }

        function updateStreak(win) {
            const streakKey = `streak_${currentLang}_${currentLen}`;
            const bestKey = `best_${currentLang}_${currentLen}`;

            let streak = parseInt(localStorage.getItem(streakKey)) || 0;
            let best = parseInt(localStorage.getItem(bestKey)) || 0;
            let earnedHint = false; // Variabile per tracciare se abbiamo vinto l'aiuto

            if (win) {
                streak++;
                if (streak > best) best = streak;

                // CONTATORE GLOBALE DELLE VITTORIE (vale per sempre e per tutte le lingue)
                let totalWins = parseInt(localStorage.getItem('mywordle_global_wins')) || 0;
                totalWins++;
                localStorage.setItem('mywordle_global_wins', totalWins);

                // Ogni 5 vittorie regaliamo l'aiuto
                if (totalWins % 5 === 0) {
                    let hints = parseInt(localStorage.getItem('mywordle_hints')) || 0;
                    hints++;
                    localStorage.setItem('mywordle_hints', hints);
                    updateHintUI();
                    earnedHint = true; // Segnaliamo che abbiamo vinto!
                }
            } else {
                streak = 0;
            }

            localStorage.setItem(streakKey, streak);
            localStorage.setItem(bestKey, best);
            
            return earnedHint; // Restituiamo il risultato
        }

        function goHome() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            currentRow = 0; currentCol = 0;
            updateHomeStats();
        }

        // Salva lo stato attuale
        function saveGameState() {
            const sessionKey = `session_${currentLang}_${currentLen}`;
            const state = {
                targetWord: targetWord,
                currentRow: currentRow,
                // Salviamo le parole inserite finora
                guesses: getGuessesSoFar(), 
                // Dati per il "velo" e la tastiera
                knownLetters: knownLetters,
                wrongPositions: wrongPositions,
                absentLetters: Array.from(absentLetters) // I Set vanno convertiti in Array per JSON
            };
            localStorage.setItem(sessionKey, JSON.stringify(state));
        }

        // Recupera le parole scritte nella griglia
        function getGuessesSoFar() {
            let guesses = [];
            for (let r = 0; r < currentRow; r++) {
                let word = "";
                for (let c = 0; c < currentLen; c++) {
                    const tile = document.getElementById(`tile-${r}-${c}`);
                    if(tile) word += tile.innerText.toLowerCase();
                }
                if(word.length === currentLen) guesses.push(word);
            }
            return guesses;
        }

        // Rimuove la sessione (da chiamare a fine partita)
        function clearGameState() {
            localStorage.removeItem(`session_${currentLang}_${currentLen}`);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            
            container.appendChild(toast);
            
            // Rimuove l'elemento dal DOM dopo che l'animazione di uscita è finita
            setTimeout(() => {
                toast.remove();
            }, 2500);
        }

        // Ascolto tastiera fisica
        window.addEventListener('keydown', (e) => {
            if(document.getElementById('game-screen').style.display === 'flex') {
                if(e.key === 'Enter') submitWord();
                else if(e.key === 'Backspace') handleInput('backspace');
                else handleInput(e.key.toLowerCase());
            }
        });

        // Questo codice viene eseguito automaticamente all'apertura della pagina
        window.onload = () => {
            // Inizializza i record basandosi sulla lingua e lunghezza predefinite
            setLanguage(currentLang);
            updateHomeStats();
            updateHintUI();
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {

                // se c'è già un SW in attesa → ricarica quando prende controllo
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
                });

            });
        }

    </script>
    <div id="end-popup" style="display:none">
        <div id="popup-content"></div>
    </div>
    <div id="toast-container"></div>

</body>
</html>
